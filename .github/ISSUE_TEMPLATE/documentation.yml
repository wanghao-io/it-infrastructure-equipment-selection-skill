name: Documentation report
description: Report missing, unclear, outdated, or contradictory documentation.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: File, section, or URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: sensitive
    attributes:
      label: Safety confirmation
      options:
        - label: This report contains no sensitive project data.
          required: true
