name: Validate Skill

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check required files
        run: |
          test -f SKILL.md
          test -f README.md
          test -d references
          test -d scripts
          test -d assets
          test -d examples
          test -d tests/scenarios
          test -f references/architecture-decision.md
          test -f references/scada-sizing.md
          test -f references/ot-control-safety.md
          test -f references/output-profiles.md
          test -f references/price-evidence.md
          test -f references/exact-configuration-pricing.md
          test -f references/live-price-research.md
          test -f references/vendor-comparison.md
          test -f references/tender-specification.md
          test -f references/network-topology.md

      - name: Python syntax check
        run: |
          python -m compileall scripts tests

      - name: Engineering scenario regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Smoke test architecture decisions
        run: |
          python - <<'PY'
          import json, tempfile, subprocess
          req = {
            "server_count": 1,
            "virtualization_required": True,
            "availability": "standard",
            "vlan_count": 5,
            "inter_vlan_communication_required": True
          }
          with tempfile.NamedTemporaryFile('w', suffix='.json', delete=False) as f:
              json.dump(req, f)
              name = f.name
          out = subprocess.check_output(['python', 'scripts/evaluate_architecture.py', name]).decode()
          assert 'not-required-by-current-requirements' in out
          assert '"layer3_routing"' in out
          PY

      - name: Smoke test sizing calculators
        run: |
          python scripts/calculate_server_capacity.py --services-json assets/server-workload-example.json > /tmp/server.json
          python scripts/calculate_historian.py 2000 5 --retention-days 365 > /tmp/historian.json
          python scripts/calculate_storage.py --drives 4 --drive-tb 4 --raid 10 > /tmp/storage.json
          python scripts/calculate_network_ports.py 30 --vlan-count 5 --inter-vlan > /tmp/network.json
          python scripts/calculate_ups.py 600 --runtime-minutes 10 > /tmp/ups.json
          grep -q 'recommended_memory_gb' /tmp/server.json
          grep -q 'recommended_online_capacity_tb' /tmp/historian.json
          grep -q 'usable_capacity_tb' /tmp/storage.json
          grep -q 'layer3_routing_required' /tmp/network.json
          grep -q 'minimum_va_with_margin' /tmp/ups.json

      - name: Smoke test live price normalization and anchor selection
        run: |
          python scripts/normalize_price_evidence.py assets/price-evidence-example.json --summary > /tmp/prices.json
          grep -q 'normalized_comparable_cost' /tmp/prices.json
          grep -q 'preferred_evidence_priority' /tmp/prices.json
          grep -q 'Market-verified / Exact-config' /tmp/prices.json
          grep -q 'confidence_level' /tmp/prices.json
          grep -q 'anchor_eligible' /tmp/prices.json
          grep -q 'anchor_exclusion_reasons' /tmp/prices.json
          grep -q 'starting-or-base-configuration-price' /tmp/prices.json
          grep -q '90000.0' /tmp/prices.json
          grep -q '92000.0' /tmp/prices.json

      - name: Smoke test vendor comparison
        run: |
          python scripts/compare_vendors.py assets/vendor-comparison-example.json > /tmp/vendor-comparison.md
          grep -q "Vendor / Model Comparison" /tmp/vendor-comparison.md

      - name: Smoke test tender specification
        run: |
          python scripts/generate_tender_spec.py assets/tender-requirements-example.json > /tmp/tender-spec.md
          grep -q "Technical Requirements" /tmp/tender-spec.md

      - name: Smoke test Mermaid topology
        run: |
          python scripts/generate_topology.py assets/topology-input-example.json --format mermaid > /tmp/topology.mmd
          grep -q "flowchart" /tmp/topology.mmd

      - name: Smoke test Graphviz topology
        run: |
          python scripts/generate_topology.py assets/topology-input-example.json --format dot > /tmp/topology.dot
          grep -q "digraph topology" /tmp/topology.dot
