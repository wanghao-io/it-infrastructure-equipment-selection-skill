name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall scripts tests
      - name: Release and metadata consistency
        run: python scripts/validate_release.py
      - name: JSON Schema contracts
        run: python scripts/validate_json_schemas.py --catalog
      - name: Unit and scenario tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Deterministic workflow smoke tests
        shell: bash
        run: |
          python scripts/compare_server_quotes.py assets/server-rfq-example.json --pretty > server-quotes.json
          python scripts/calculate_hci_failover.py assets/hci-failover-example.json --pretty > hci.json
          python scripts/normalize_price_evidence.py assets/price-evidence-example.json --summary --strict-contract > prices.json
          python scripts/compare_vendors.py assets/vendor-comparison-example.json > vendor.md
          grep -q '"status": "ready"' server-quotes.json
          grep -q '"status": "PASS"' hci.json
          grep -q 'Market-verified / Exact-config' prices.json
          grep -q 'Vendor / Model Comparison' vendor.md
          python scripts/infra_cli.py list
          python scripts/infra_cli.py validate price-evidence-v2 assets/price-evidence-v2-example.json
          python scripts/normalize_price_evidence.py assets/price-evidence-v2-example.json --summary --strict-contract > prices-v2.json
          grep -q 'Market-verified / Exact-config' prices-v2.json

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Verify runtime and clean copy install
        run: |
          test -f VERSION
          test -f SKILL.md
          test -f references/server-quotation-workflow.md
          test -f schemas/server-rfq.schema.json
          test -f examples/real-project-retrospectives/manufacturing-scada-budget-revision.json
          test -f scripts/infra_cli.py
          test -f schemas/v2/price-evidence.schema.json
          python scripts/install_skill.py --target codex --scope project --project-dir "$RUNNER_TEMP/install-target"
          test -f "$RUNNER_TEMP/install-target/.agents/skills/it-infrastructure-equipment-selection/SKILL.md"
          python "$RUNNER_TEMP/install-target/.agents/skills/it-infrastructure-equipment-selection/scripts/compare_server_quotes.py" assets/server-rfq-example.json
