name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  metadata-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Verify tag, version, main head, and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$(cat VERSION)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          python scripts/validate_release.py
          python scripts/extract_release_notes.py "$TAG" --output "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

  full-validation:
    needs: metadata-gate
    permissions:
      contents: read
    uses: ./.github/workflows/validate-skill.yml

  gh-skill-dry-run:
    needs: [metadata-gate, full-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify runner gh skill publish compatibility
        run: |
          HELP_FILE="$RUNNER_TEMP/gh-skill-publish-help.txt"
          gh --version
          if ! gh skill publish --help > "$HELP_FILE"; then
            echo "runner gh does not provide the required 'skill publish' command" >&2
            exit 1
          fi
          if ! grep -q -- '--dry-run' "$HELP_FILE"; then
            echo "runner gh skill publish does not provide the required --dry-run flag" >&2
            exit 1
          fi
      - name: Validate standard Agent Skills publish layout
        run: |
          PUBLISH_ROOT="$RUNNER_TEMP/gh-skill-publish"
          SKILL_ROOT="$PUBLISH_ROOT/it-infrastructure-equipment-selection"
          mkdir -p "$SKILL_ROOT"
          git archive "$GITHUB_SHA" | tar -x -C "$SKILL_ROOT"
          gh skill publish "$PUBLISH_ROOT" --dry-run
          test -z "$(git status --porcelain)"

  build-release:
    needs: [metadata-gate, full-validation, gh-skill-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Build release archive and current-version notes
        run: |
          python scripts/extract_release_notes.py "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/release-notes.md"
          git archive --format=tar.gz --prefix=it-infrastructure-equipment-selection/ -o "$RUNNER_TEMP/skill.tar.gz" "$GITHUB_SHA"
          cd "$RUNNER_TEMP"
          sha256sum skill.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Smoke test the clean release archive
        run: |
          ARCHIVE_ROOT="$RUNNER_TEMP/archive-root"
          INSTALL_TARGET="$RUNNER_TEMP/archive-install"
          mkdir -p "$ARCHIVE_ROOT"
          tar -xzf "$RUNNER_TEMP/skill.tar.gz" -C "$ARCHIVE_ROOT"
          SOURCE_ROOT="$ARCHIVE_ROOT/it-infrastructure-equipment-selection"
          python "$SOURCE_ROOT/scripts/install_skill.py" --target codex --scope project --project-dir "$INSTALL_TARGET"
          INSTALLED_ROOT="$INSTALL_TARGET/.agents/skills/it-infrastructure-equipment-selection"
          test -f "$INSTALLED_ROOT/SKILL.md"
          test "$(cat "$INSTALLED_ROOT/VERSION")" = "${GITHUB_REF_NAME#v}"
          python "$INSTALLED_ROOT/scripts/compare_server_quotes.py" "$INSTALLED_ROOT/assets/server-rfq-example.json"
          python "$INSTALLED_ROOT/scripts/calculate_hci_failover.py" "$INSTALLED_ROOT/assets/hci-failover-example.json"
          python "$INSTALLED_ROOT/scripts/infra_cli.py" project-check project-delivery "$INSTALLED_ROOT/assets/project-delivery-example.json"
      - name: Stage immutable release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: release-inputs-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/skill.tar.gz
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: release-inputs-${{ github.ref_name }}
          path: release-inputs
      - name: Verify and publish once
        working-directory: release-inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$GITHUB_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "tag SHA $GITHUB_SHA is no longer the current main HEAD $CURRENT_MAIN_SHA" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" skill.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
