name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Verify version and test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(cat VERSION)"
          grep -q "## $TAG" CHANGELOG.md
          grep -q "Skill $TAG" RELEASE_NOTES.md
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build release archive
        run: |
          git archive --format=tar.gz --prefix=it-infrastructure-equipment-selection/ -o skill.tar.gz "$GITHUB_SHA"
          sha256sum skill.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" skill.tar.gz SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
