name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify version and test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(cat VERSION)"
          grep -q "## $TAG" CHANGELOG.md
          grep -q "Skill $TAG" RELEASE_NOTES.md
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build release archive
        run: |
          git archive --format=tar.gz --prefix=it-infrastructure-equipment-selection/ -o skill.tar.gz "$GITHUB_SHA"
          sha256sum skill.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" skill.tar.gz SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
